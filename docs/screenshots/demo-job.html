<!doctype html>
<!--
  Template for the fictional job postings in docs/screenshots/capture-extension.mjs, which fills
  in the {{…}} values. Not real companies or job boards.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{title}} · {{company}} · {{board}}</title>
    {{jsonld}}
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.55 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: #1f2937;
        background: {{pageBg}};
      }
      header {
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 16px 40px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
      }
      .brand {
        font-weight: 700;
        font-size: 20px;
        color: {{accent}};
        letter-spacing: -0.02em;
      }
      nav {
        display: flex;
        gap: 22px;
        color: #4b5563;
        font-size: 15px;
      }
      main {
        max-width: 820px;
        padding: 36px 40px;
      }
      .crumbs {
        color: #6b7280;
        font-size: 14px;
      }
      .head {
        display: flex;
        gap: 20px;
        align-items: center;
        margin-top: 22px;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: {{logoBg}};
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 26px;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        color: #111827;
      }
      .company {
        margin-top: 4px;
        font-size: 17px;
        color: #374151;
        font-weight: 500;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }
      .chip {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 14px;
        color: #374151;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 26px;
      }
      .btn {
        border-radius: 10px;
        padding: 11px 22px;
        font-weight: 600;
        font-size: 15px;
        border: 1px solid {{accent}};
      }
      .primary {
        background: {{accent}};
        color: #fff;
      }
      .ghost {
        background: #fff;
        color: {{accent}};
      }
      section {
        margin-top: 34px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 24px 28px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 18px;
        color: #111827;
      }
      ul {
        margin: 8px 0 0;
        padding-left: 20px;
      }
      li {
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">{{board}}</span>
      <nav><span>Find jobs</span><span>Companies</span><span>Salaries</span></nav>
    </header>
    <main>
      <div class="crumbs">Jobs / {{team}}</div>
      <div class="head">
        <div class="logo">{{logo}}</div>
        <div>
          <h1>{{title}}</h1>
          <div class="company">{{company}}</div>
        </div>
      </div>
      <div class="meta">
        <span class="chip location">{{location}}</span>
        <span class="chip">{{workType}}</span>
        <span class="chip">Full-time</span>
      </div>
      <div class="actions">
        <span class="btn primary">Apply now</span>
        <span class="btn ghost">Save</span>
      </div>
      <section>
        <h2>About the role</h2>
        <p>{{about}}</p>
        <p>Pay: <span class="salary">{{salary}}</span>, plus equity and a learning budget.</p>
        <ul>
          {{bullets}}
        </ul>
      </section>
    </main>
  </body>
</html>
