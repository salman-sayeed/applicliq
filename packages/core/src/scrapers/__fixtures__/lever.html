<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vandelay Industries - Data Engineer</title>
    <meta property="og:title" content="Vandelay Industries - Data Engineer" />
  </head>
  <body>
    <div class="main-header page-full-width section-wrapper">
      <div class="main-header-content page-centered narrow-section">
        <a class="main-header-logo" href="https://jobs.lever.co/vandelay"
          ><img alt="Vandelay Industries logo" src="logo.png"
        /></a>
      </div>
    </div>
    <div class="content-wrapper posting-page">
      <div class="posting-headline">
        <h2>Data Engineer</h2>
        <div class="posting-categories">
          <div
            class="sort-by-time posting-category medium-category-label width-full capitalize-labels location"
          >
            London, United Kingdom
          </div>
          <div
            class="sort-by-team posting-category medium-category-label capitalize-labels department"
          >
            Engineering – Data /
          </div>
          <div
            class="sort-by-commitment posting-category medium-category-label capitalize-labels commitment"
          >
            Full-time /
          </div>
          <div
            class="sort-by-time posting-category medium-category-label capitalize-labels workplaceTypes"
          >
            Hybrid
          </div>
        </div>
      </div>
      <div class="section-wrapper page-full-width">
        <div class="section page-centered" data-qa="job-description">
          <div>Vandelay Industries imports and exports.</div>
        </div>
        <div class="section page-centered">
          <h3>What you'll do</h3>
          <ul class="posting-requirements plain-list">
            <li>Build Airflow pipelines</li>
            <li>Model data in dbt</li>
          </ul>
        </div>
        <div class="section page-centered" data-qa="salary-range">
          <h4>Salary range</h4>
          <div class="salary-range">£60,000 - £75,000 a year</div>
        </div>
        <div class="section page-centered last-section-apply">
          <a class="postings-btn template-btn-submit" href="apply">Apply for this job</a>
        </div>
      </div>
    </div>
  </body>
</html>
