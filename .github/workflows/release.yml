name: Release

# Push a version tag to publish a release:
#   git tag v1.2.3 && git push origin v1.2.3
# The tag sets the extension version; Chrome, Edge and Firefox zips (plus the Firefox sources zip
# that addons.mozilla.org asks for, an Edge Add-ons upload without the pinned key, and the Chrome
# zip again as career-pocket-chromium.zip for the website's manual install guide) are attached to
# a GitHub Release.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish extension zips
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Optional repository secrets. Without them the extension builds with sync turned off.
      WXT_GOOGLE_CLIENT_ID_WEB: ${{ secrets.WXT_GOOGLE_CLIENT_ID_WEB }}
      WXT_GOOGLE_CLIENT_ID_CHROME: ${{ secrets.WXT_GOOGLE_CLIENT_ID_CHROME }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check, lint and test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Set the extension version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a browser extension version (like v1.2.3)."
            exit 1
          fi
          cd apps/extension
          npm pkg set version="$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build zips
        working-directory: apps/extension
        run: |
          # Edge Add-ons upload first, without the pinned key (the store assigns its own ID).
          WXT_STORE_BUILD=true pnpm zip:edge
          mv ".output/career-pocket-$VERSION-edge.zip" "$RUNNER_TEMP/career-pocket-$VERSION-edge-store.zip"
          # Chrome/Edge/Brave zips for loading unpacked: pinned ID, so Google sign-in works.
          pnpm zip
          # The same Chrome build under a fixed name, so the site's link to
          # releases/latest/download/career-pocket-chromium.zip always gets the newest one.
          cp ".output/career-pocket-$VERSION-chrome.zip" .output/career-pocket-chromium.zip
          pnpm zip:edge
          pnpm zip:firefox
          mv "$RUNNER_TEMP/career-pocket-$VERSION-edge-store.zip" .output/
          ls -l .output/*.zip

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apps/extension/.output/*.zip \
            --title "Career Pocket $VERSION" \
            --generate-notes \
            --verify-tag
